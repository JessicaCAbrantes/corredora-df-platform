# Local development PostgreSQL only (Backend Foundation).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: corredora
      POSTGRES_PASSWORD: corredora
      POSTGRES_DB: corredora_df
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corredora -d corredora_df"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
