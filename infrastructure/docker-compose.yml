# Local development PostgreSQL + Prometheus + Grafana + Alertmanager
# (FASE 4.1-B / 4.1-C1 / 4.1-D2).
#
# Postgres: local DX for the API.
# Prometheus: scrapes GET /metrics on the API running on the host
#             (API is NOT containerized in this phase).
# Grafana: UI on localhost:3002 — datasource/provider provisioned from git.
# Alertmanager: UI on localhost:9093 — local notify path only (dummy webhook).
#
# Before `up`: copy the local metrics bearer (see docs/platform/observability-local.md)
#   cp infrastructure/observability/secrets/bearer_token.example \
#      infrastructure/observability/secrets/bearer_token
#
# API .env must enable metrics with the SAME token:
#   METRICS_ENABLED=true
#   METRICS_BEARER_TOKEN=local-corredora-metrics-dev-token
#
# Grafana local login defaults to admin/admin — change after first login (local only).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: corredora
      POSTGRES_PASSWORD: corredora
      POSTGRES_DB: corredora_df
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corredora -d corredora_df"]
      interval: 5s
      timeout: 5s
      retries: 5

  alert-webhook:
    # Local dummy receiver — logs Alertmanager POST bodies to container stdout.
    # Not Slack/Teams/email/PagerDuty. No host port published (compose-internal only).
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: "8080"
      LOG_IGNORE_PATH: /favicon.ico

  alertmanager:
    image: prom/alertmanager:v0.27.0
    depends_on:
      - alert-webhook
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - alertmanager
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - ./observability/secrets/bearer_token:/etc/prometheus/secrets/bearer_token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      # Linux Docker Engine: resolve host.docker.internal to the host gateway.
      # Docker Desktop (Windows/macOS) already provides host.docker.internal.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    ports:
      # Avoid Next.js (:3000) and API (:3001).
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3002
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: ""
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Local-only defaults — change password after first login; never use in production.

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
