name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Least privilege — this workflow only checks out and runs tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # pnpm@11.12.0 requires Node >= 22.13 (uses node:sqlite).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (API)
        run: pnpm --filter api prisma:generate

      - name: Lint API
        run: pnpm --filter api lint

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Unit tests API
        run: pnpm --filter api test

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Unit tests Web
        run: pnpm --filter web test

  integration:
    name: Integration / E2E
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI-only Postgres fixtures — never reuse in staging or production.
          POSTGRES_USER: corredora
          POSTGRES_PASSWORD: corredora
          POSTGRES_DB: corredora_df
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corredora -d corredora_df"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # ---------------------------------------------------------------------------
    # CI-only test fixtures. These values are deliberately non-production.
    # Never reuse them in staging or production.
    # See docs/setup/environment.md — Secrets strategy.
    # ---------------------------------------------------------------------------
    # - DATABASE_URL          → fixture (test DB credentials)
    # - AUTH_SECRET           → fixture (HMAC test secret)
    # - POSTGRES_* (service)  → fixtures (see above)
    # - PAYMENT_PROVIDER=mock → fixture (no Stripe in CI)
    # - localhost URLs        → fixtures
    # - KIT_PICKUP_OPERATOR_USER_IDS → fixture (seed user id)
    # ---------------------------------------------------------------------------
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://corredora:corredora@localhost:5432/corredora_df?schema=public
      AUTH_SECRET: ci-test-auth-secret-must-be-long-enough-for-hmac
      CORS_ORIGIN: http://localhost:3000
      PAYMENT_PROVIDER: mock
      PUBLIC_API_BASE_URL: http://localhost:3001
      PAYMENT_SUCCESS_URL: http://localhost:3000/kit-pickup-requests/payment/success
      PAYMENT_CANCEL_URL: http://localhost:3000/kit-pickup-requests/payment/cancel
      KIT_PICKUP_OPERATOR_USER_IDS: usr_seed_runner
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # pnpm@11.12.0 requires Node >= 22.13 (uses node:sqlite).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Prisma migrate deploy
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Prisma seed
        working-directory: apps/api
        run: pnpm prisma:seed

      - name: E2E tests
        working-directory: apps/api
        run: pnpm test:e2e
